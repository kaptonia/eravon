[package]
name = "app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The ERAVON Desk window: the family's app skeleton (actions, tasks, shell, window) with this product's pages"

[lib]
name = "app"
path = "src/lib.rs"

[dependencies]
eravon = { path = "../eravon" }
eravon-os = { path = "../eravon-os" }
eravon-ui = { path = "../eravon-ui" }
eravon-chain = { path = "../eravon-chain" }
eravon-net = { path = "../eravon-net" }
eravon-link = { path = "../eravon-link" }
eravon-literals = { path = "../eravon-literals" }
eravon-store = { path = "../eravon-store" }
eravon-vault = { path = "../eravon-vault" }
eravon-terms = { path = "../eravon-terms" }
eravon-payways = { path = "../eravon-payways" }
eravon-cands = { path = "../eravon-cands" }
eravon-goods = { path = "../eravon-goods" }
eravon-cli = { path = "../eravon-cli" }
eravon-watch = { path = "../eravon-watch" }
eravon-deliver = { path = "../eravon-deliver" }
eravon-dispute = { path = "../eravon-dispute" }
eravon-orders = { path = "../eravon-orders" }
eravon-home = { path = "../eravon-home" }
eravon-pay = { path = "../eravon-pay" }
eravon-import = { path = "../eravon-import" }
eravon-after = { path = "../eravon-after" }
eravon-wallet = { path = "../eravon-wallet" }
eravon-qr = { path = "../eravon-qr" }
eravon-zikaron = { path = "../eravon-zikaron" }
eravon-scan = { path = "../eravon-scan" }
eravon-standard = { path = "../eravon-standard" }
eravon-galeed = { path = "../eravon-galeed" }
eravon-recheck = { path = "../eravon-recheck" }
eravon-export = { path = "../eravon-export" }
eravon-statement = { path = "../eravon-statement" }
eravon-glue = { path = "../eravon-glue" }
eravon-seal = { path = "../eravon-seal" }
eravon-send = { path = "../eravon-send" }
eframe = { version = "0.34", default-features = false, features = ["glow"] }
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "x11", "wayland"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
log = "0.4"
winit = { version = "0.30", default-features = false, features = ["x11"] }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = { version = "0.31", features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wgpu_no_default_features"] }
wgpu = { version = "29", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSString"] }

[features]
real-notify = []

[dev-dependencies]
eravon-vault = { path = "../eravon-vault", features = ["testing"] }

[build-dependencies]
eravon-pack = { path = "../eravon-pack" }

[[bin]]
name = "eravon-app"
path = "src/bin/eravon-app.rs"
